<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SABR Draft Board</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>SABR Draft Board</h1>
    <div id="onClock"></div>
    <div id="timer">60</div>
  </header>

  <section class="panel commissioner">
    <h2>Commissioner Controls</h2>
    <input id="commissionerKey" type="password" placeholder="Commissioner key" value="commissioner" />
    <div class="row">
      <input id="csvFile" type="file" accept=".csv" />
      <button id="uploadBtn">Upload CSV Roster</button>
      <button id="startBtn">Start Draft</button>
      <button id="pauseBtn">Pause</button>
      <button id="resumeBtn">Resume</button>
      <button id="skipBtn">Skip Pick</button>
      <button id="undoBtn">Undo Pick</button>
      <button id="resetBtn">Reset Draft</button>
      <button id="exportBtn">Export Results</button>
    </div>
    <small>Required CSV columns: name, age, rating (1-5), position. Duplicate names not allowed.</small>
    <div id="status"></div>
  </section>

  <main>
    <section class="panel players">
      <h2>Available Players</h2>
      <table id="playersTable">
        <thead><tr><th>Name</th><th>Age</th><th>Rating</th><th>Position</th><th>Action</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel rosters">
      <h2>Team Rosters</h2>
      <div id="rostersGrid"></div>
    </section>

    <section class="panel history">
      <h2>Draft History</h2>
      <table id="historyTable">
        <thead><tr><th>Pick #</th><th>Round</th><th>Team</th><th>Player</th><th>Position</th><th>Rating</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
